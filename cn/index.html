<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>飞天小象私人导航</title>
<meta name="description" content="飞天小象私人导航">
<style>
:root{
  --bg:#07101e;
  --bg2:#0b1324;
  --text:#eef3ff;
  --muted:#a5b0c7;
  --line:rgba(255,255,255,.10);
  --line-strong:rgba(255,255,255,.16);
  --glass:rgba(14,20,36,.46);
  --glass-2:rgba(15,23,40,.58);
  --accent:#7c8cff;
  --accent2:#a855f7;
  --accent3:#5eead4;
  --shadow:0 18px 50px rgba(0,0,0,.28);
  --sidebar:256px;
}
[data-theme="light"]{
  --bg:#eef3ff;
  --bg2:#f6f8ff;
  --text:#0f172a;
  --muted:#65728b;
  --line:rgba(15,23,42,.10);
  --line-strong:rgba(15,23,42,.16);
  --glass:rgba(255,255,255,.58);
  --glass-2:rgba(255,255,255,.70);
  --shadow:0 18px 46px rgba(85,102,140,.14);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(60rem 40rem at 10% -10%, rgba(124,140,255,.26), transparent 55%),
    radial-gradient(35rem 25rem at 90% 8%, rgba(168,85,247,.20), transparent 52%),
    radial-gradient(34rem 22rem at 20% 92%, rgba(94,234,212,.10), transparent 48%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  background-attachment:fixed;
  overflow-x:hidden;
}
body:before{
  content:""; position:fixed; inset:-10%;
  backdrop-filter:blur(3px); pointer-events:none; z-index:-1;
}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
.glass{
  background:var(--glass);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
}
.glass-soft{
  background:var(--glass-2);
  border:1px solid var(--line);
  backdrop-filter:blur(14px) saturate(150%);
  -webkit-backdrop-filter:blur(14px) saturate(150%);
}

/* sidebar */
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);
  padding:18px 14px 18px;
  background:linear-gradient(180deg, rgba(11,17,31,.55), rgba(8,13,25,.45));
  border-right:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(24px) saturate(150%);
  -webkit-backdrop-filter:blur(24px) saturate(150%);
  overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
}
.sidebar::-webkit-scrollbar{width:0;height:0}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 20px}
.brand-logo{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
  color:#fff;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 12px 28px rgba(124,140,255,.24)
}
.brand b{display:block;font-size:17px}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.side-section-title{
  font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--muted);
  padding:14px 10px 8px;text-transform:uppercase
}
.nav-btn{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:14px;border:1px solid transparent;background:transparent;
  color:var(--text);transition:.18s;text-align:left;margin:3px 0
}
.nav-btn:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.06)}
.nav-btn.active{
  background:linear-gradient(90deg, rgba(124,140,255,.18), rgba(168,85,247,.10));
  border-color:rgba(124,140,255,.24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)
}
.nav-icon{
  width:30px;height:30px;border-radius:11px;display:grid;place-items:center;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  color:#dfe7ff;font-size:12px;font-weight:900;flex:0 0 30px
}
.nav-btn.active .nav-icon{
  background:linear-gradient(135deg, rgba(124,140,255,.24), rgba(168,85,247,.18));
  border-color:rgba(124,140,255,.25);color:#fff
}
.label{
  flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:13px;font-weight:700
}
.count{
  flex:0 0 auto;min-width:24px;height:22px;padding:0 7px;border-radius:999px;
  display:grid;place-items:center;font-size:10px;color:var(--muted);
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)
}
.sidebar-footer{padding:18px 10px 6px;color:var(--muted);font-size:11px;line-height:1.7}

/* main */
.main{grid-column:2;min-width:0;padding:22px clamp(18px,3vw,42px) 54px}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:20px}
.icon-btn,.soft-btn,.primary-btn{
  height:38px;border-radius:13px;padding:0 14px;border:1px solid var(--line);
  color:var(--text);background:var(--glass);display:inline-flex;align-items:center;justify-content:center;gap:8px;
  backdrop-filter:blur(14px) saturate(150%);
  -webkit-backdrop-filter:blur(14px) saturate(150%);
  box-shadow:var(--shadow);white-space:nowrap
}
.icon-btn{width:38px;padding:0}
.primary-btn{
  border:1px solid rgba(124,140,255,.25);
  background:linear-gradient(135deg, rgba(124,140,255,.85), rgba(168,85,247,.82));
  color:#fff;font-weight:800
}
.mobile-menu{display:none}

/* hero */
.hero{
  position:relative;overflow:hidden;border-radius:30px;padding:42px 42px 30px;
}
.hero:before{
  content:"";position:absolute;width:380px;height:380px;border-radius:50%;
  right:-110px;top:-180px;background:radial-gradient(circle, rgba(124,140,255,.34), rgba(124,140,255,.08) 40%, transparent 68%);
  filter:blur(8px);pointer-events:none
}
.hero:after{
  content:"";position:absolute;width:220px;height:220px;border-radius:50%;
  left:-40px;bottom:-120px;background:radial-gradient(circle, rgba(94,234,212,.12), transparent 68%);
  filter:blur(10px);pointer-events:none
}
.kicker{
  position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;
  padding:7px 12px;border-radius:999px;border:1px solid var(--line-strong);
  background:rgba(255,255,255,.04);color:var(--muted);font-size:11px
}
.hero h1{
  position:relative;z-index:1;
  font-size:clamp(34px,5vw,60px);line-height:1.02;letter-spacing:-.05em;
  margin:18px 0 8px
}
.hero p{position:relative;z-index:1;color:var(--muted);margin:0 0 24px;font-size:15px}
.search-shell{position:relative;z-index:1;width:min(940px,100%);border-radius:22px;padding:14px}
.search-row{
  display:flex;align-items:center;gap:14px;height:58px;padding:0 16px;
  border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)
}
.search-icon{
  width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  font-size:15px;color:#eaf0ff;flex:0 0 36px
}
.search-input{
  flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--text);font-size:15px
}
.search-input::placeholder{color:var(--muted)}
.search-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.meta-pill{
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);
  color:var(--muted);font-size:11px;padding:7px 10px;border-radius:999px
}

/* sections / cards */
.section{margin:28px 0;scroll-margin-top:20px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.section-title{display:flex;align-items:center;gap:10px}
.badge{
  width:36px;height:36px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(135deg, rgba(124,140,255,.20), rgba(168,85,247,.14));
  border:1px solid rgba(124,140,255,.22);color:#eff3ff;font-size:12px;font-weight:900
}
.section-title h2{margin:0;font-size:18px}
.section-title small{font-size:12px;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{
  position:relative;display:flex;align-items:center;gap:12px;min-width:0;min-height:78px;
  padding:14px 15px;border-radius:18px;transition:.18s
}
.card:hover{
  transform:translateY(-2px);box-shadow:0 20px 44px rgba(0,0,0,.18);border-color:rgba(124,140,255,.26)
}
.favicon-wrap{
  position:relative;flex:0 0 42px;width:42px;height:42px;border-radius:14px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);
  display:grid;place-items:center;overflow:hidden
}
.favicon{
  position:absolute;inset:0;margin:auto;width:26px;height:26px;display:block;object-fit:contain;z-index:2
}
.fallback{
  display:grid;position:absolute;inset:0;place-items:center;font-size:14px;font-weight:900;
  color:#fff;background:linear-gradient(135deg, rgba(124,140,255,.55), rgba(168,85,247,.50));
  z-index:1
}
.fallback.hide{display:none}
.card-info{min-width:0;flex:1;padding-right:18px}
.card-name{font-size:14px;font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-domain{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{
  position:absolute;right:8px;top:7px;border:0;background:transparent;color:#bdc7dc;font-size:16px;
  line-height:1;padding:5px;opacity:0;transition:.16s
}
.card:hover .star,.star.on{opacity:1}
.star.on{color:#f59e0b}
.empty{padding:58px 20px;text-align:center;color:var(--muted);border-radius:22px}
.footer{color:var(--muted);font-size:11px;text-align:center;padding:26px 0 0}

/* drawer */
.drawer-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(4px);
  z-index:80;opacity:0;pointer-events:none;transition:.2s
}
.drawer-backdrop.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;right:0;top:0;bottom:0;width:min(520px,100%);z-index:90;
  background:rgba(12,18,31,.72);border-left:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  box-shadow:-24px 0 60px rgba(0,0,0,.24);transform:translateX(104%);transition:.24s;overflow:auto
}
.drawer.show{transform:translateX(0)}
.drawer-head{
  position:sticky;top:0;z-index:2;padding:20px 22px;border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(12,18,31,.60);backdrop-filter:blur(18px)
}
.drawer-bar{display:flex;justify-content:space-between;align-items:center}
.drawer-body{padding:22px}
.notice{
  font-size:12px;line-height:1.7;color:var(--muted);padding:13px 14px;border-radius:16px;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);margin-bottom:18px
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted);font-weight:700}
.field input,.field select{
  height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.05);color:var(--text);outline:none;padding:0 12px
}
.drawer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.custom-list{margin-top:28px;border-top:1px solid rgba(255,255,255,.08);padding-top:20px}
.custom-item{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.custom-item .grow{flex:1;min-width:0}
.custom-item b{font-size:13px}
.custom-item small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.danger{color:#ff7c7c}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:rgba(10,14,22,.88);
  color:#fff;border-radius:12px;padding:10px 14px;font-size:12px;z-index:120;opacity:0;pointer-events:none;transition:.2s
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:1280px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:980px){
  :root{--sidebar:0px}
  .app{display:block}
  .sidebar{transform:translateX(-105%);width:286px;transition:.22s;box-shadow:22px 0 48px rgba(0,0,0,.28)}
  .sidebar.show{transform:translateX(0)}
  .main{padding:16px 14px 42px}
  .mobile-menu{display:inline-flex}
  .topbar{justify-content:space-between}
  .hero{padding:28px 18px 22px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:640px){
  .grid{grid-template-columns:1fr}
  .hero h1{font-size:34px}
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .hide-sm{display:none}
  .search-row{height:54px;padding:0 12px}
  .search-input{font-size:14px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">D</div>
      <div><b>Dumbo Nav</b><small>飞天小象私人导航</small></div>
    </div>

    <div class="side-section-title">快速访问</div>
    <button class="nav-btn active" data-filter="all">
      <span class="nav-icon" id="icon-all"></span><span class="label">全部网站</span><span class="count" id="allCount"></span>
    </button>
    <button class="nav-btn" data-filter="favorite">
      <span class="nav-icon" id="icon-favorite"></span><span class="label">我的收藏</span><span class="count" id="favCount">0</span>
    </button>
    <button class="nav-btn" data-filter="recent">
      <span class="nav-icon" id="icon-recent"></span><span class="label">最近访问</span><span class="count" id="recentCount">0</span>
    </button>

    <div class="side-section-title">分类</div>
    <div id="categoryNav"></div>

    <div class="sidebar-footer">
      飞天小象私人导航<br>
      只保留站内搜索，快速找到你收藏夹里的内容。
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="icon-btn mobile-menu" id="mobileMenuBtn" title="菜单">☰</button>
      <div style="display:flex;gap:10px;margin-left:auto">
        <button class="soft-btn hide-sm" id="manageBtn">＋ 管理 / 新增</button>
        <button class="icon-btn" id="themeBtn" title="切换深浅模式">◐</button>
      </div>
    </div>

    <section class="hero glass">
      <span class="kicker">✦ FEITIANXIAOXIANG · PRIVATE NAV</span>
      <h1>找到你要去的地方。</h1>
      <p>只做一件事：在你的收藏夹里，快速找到网站并打开。</p>

      <div class="search-shell glass-soft">
        <div class="search-row">
          <span class="search-icon">⌕</span>
          <input id="searchInput" class="search-input" autocomplete="off" placeholder="站内搜索：输入网站名称、域名、关键词…">
        </div>
        <div class="search-meta">
          <span class="meta-pill"><b id="siteCount"></b> 个网站</span>
          <span class="meta-pill"><b id="catCount"></b> 个分类</span>
          <span class="meta-pill">Ctrl / ⌘ + K 聚焦搜索</span>
        </div>
      </div>
    </section>

    <div id="content"></div>
    <div class="footer">© 2026 飞天小象私人导航 · Glass Edition</div>
  </main>
</div>

<div class="drawer-backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-bar">
      <div>
        <h2 style="margin:0">管理导航</h2>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">新增你自己的网址</div>
      </div>
      <button class="icon-btn" id="closeDrawer">×</button>
    </div>
  </div>
  <div class="drawer-body">
    <div class="notice">
      当前仍是“单文件直接粘贴版”：你新增的内容保存在当前浏览器本地。
      以后如果部署到自己的服务器，我可以继续给你升级成真正后台版（账号登录 + SQLite 保存）。
    </div>
    <form id="addForm">
      <div class="form-grid">
        <div class="field"><label>网站名称</label><input id="newName" required placeholder="例如：ChatGPT"></div>
        <div class="field"><label>分类</label><select id="newCategory"></select></div>
        <div class="field full"><label>网址</label><input id="newUrl" required placeholder="https://example.com"></div>
      </div>
      <div class="drawer-actions">
        <button class="primary-btn" type="submit">＋ 添加到导航</button>
        <button class="soft-btn" type="button" id="exportBtn">导出配置</button>
        <button class="soft-btn" type="button" id="importBtn">导入配置</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </form>
    <div class="custom-list">
      <h3 style="margin:0 0 12px">我的新增</h3>
      <div id="customList"></div>
    </div>
  </div>
</aside>

const KEYS = {
  theme:"dumbo_theme_v4",
  favorites:"dumbo_favorites",
  recents:"dumbo_recents",
  custom:"dumbo_custom"
};

const state = {
  filter:"all",
  query:"",
  favorites:new Set(JSON.parse(localStorage.getItem(KEYS.favorites)||"[]")),
  recents:JSON.parse(localStorage.getItem(KEYS.recents)||"[]"),
  custom:JSON.parse(localStorage.getItem(KEYS.custom)||"[]")
};

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function iconFor(key){ return ICON_MAP[key] || "•"; }

function applyQuickIcons(){
  $("#icon-all").textContent = iconFor("all");
  $("#icon-favorite").textContent = iconFor("favorite");
  $("#icon-recent").textContent = iconFor("recent");
}

function save(){
  localStorage.setItem(KEYS.favorites, JSON.stringify([...state.favorites]));
  localStorage.setItem(KEYS.recents, JSON.stringify(state.recents.slice(0,24)));
  localStorage.setItem(KEYS.custom, JSON.stringify(state.custom));
}
function allSites(){ return [...BUILTIN_SITES, ...state.custom]; }
function slug(v){ return "cat-"+v.replace(/[^\w\u4e00-\u9fa5]+/g,"-"); }

function toast(msg){
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window.__toast);
  window.__toast = setTimeout(()=>el.classList.remove("show"), 1800);
}

function onlineFavicon(site){
  return "https://www.google.com/s2/favicons?sz=64&domain_url=" + encodeURIComponent(site.url);
}
function duckFavicon(site){
  return "https://icons.duckduckgo.com/ip3/" + encodeURIComponent(site.domain || "") + ".ico";
}

/* 修复“新增加进去之后不显示图标”：
   - 先显示首字母 fallback
   - 图标加载成功后再隐藏 fallback
   - 图标失败时 fallback 会一直保留，不会再出现空白 */
function createIcon(site){
  const wrap = document.createElement("div");
  wrap.className = "favicon-wrap";

  const fallback = document.createElement("span");
  fallback.className = "fallback";
  fallback.textContent = (site.name || "?").trim().charAt(0).toUpperCase();

  const img = document.createElement("img");
  img.className = "favicon";
  img.loading = "lazy";
  img.alt = "";

  let step = 0;
  img.onerror = () => {
    if(step === 0){
      step = 1;
      img.src = duckFavicon(site);
    }else{
      img.remove();
      fallback.classList.remove("hide");
    }
  };
  img.onload = () => {
    fallback.classList.add("hide");
  };

  // 默认先显示 fallback，避免空白
  fallback.classList.remove("hide");

  if(site.icon){
    step = -1;
    img.onerror = () => {
      step = 0;
      img.onerror = () => {
        if(step === 0){
          step = 1;
          img.src = duckFavicon(site);
        }else{
          img.remove();
          fallback.classList.remove("hide");
        }
      };
      img.src = onlineFavicon(site);
    };
    img.src = site.icon;
  } else {
    img.src = onlineFavicon(site);
  }

  wrap.append(fallback, img);
  return wrap;
}

function createCard(site){
  const a = document.createElement("a");
  a.className = "card glass";
  a.href = site.url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.title = site.fullTitle || site.name;
  a.addEventListener("click", ()=>recordRecent(site.id));

  const info = document.createElement("div");
  info.className = "card-info";

  const n = document.createElement("div");
  n.className = "card-name";
  n.textContent = site.name;

  const d = document.createElement("div");
  d.className = "card-domain";
  d.textContent = site.domain || new URL(site.url).hostname;

  info.append(n,d);

  const star = document.createElement("button");
  star.className = "star" + (state.favorites.has(site.id) ? " on" : "");
  star.type = "button";
  star.textContent = state.favorites.has(site.id) ? "★" : "☆";
  star.title = "收藏";
  star.addEventListener("click", e=>{
    e.preventDefault();
    e.stopPropagation();
    toggleFavorite(site.id);
  });

  a.append(createIcon(site), info, star);
  return a;
}

function recordRecent(id){
  state.recents = [id, ...state.recents.filter(x=>x!==id)].slice(0,24);
  save();
}
function toggleFavorite(id){
  state.favorites.has(id) ? state.favorites.delete(id) : state.favorites.add(id);
  save();
  render();
}

function getVisibleSites(){
  const map = new Map(allSites().map(s=>[s.id, s]));
  let arr = allSites();

  if(state.filter === "favorite") arr = arr.filter(s=>state.favorites.has(s.id));
  else if(state.filter === "recent") arr = state.recents.map(id=>map.get(id)).filter(Boolean);
  else if(state.filter !== "all") arr = arr.filter(s=>s.category === state.filter);

  const q = state.query.trim().toLowerCase();
  if(q){
    arr = arr.filter(s =>
      (s.name + " " + s.domain + " " + (s.fullTitle || "") + " " + s.category).toLowerCase().includes(q)
    );
  }
  return arr;
}

function sectionBlock(cat, sites, icon){
  const sec = document.createElement("section");
  sec.className = "section";
  sec.id = slug(cat);

  const head = document.createElement("div");
  head.className = "section-head";

  const title = document.createElement("div");
  title.className = "section-title";

  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = icon || "•";

  const h = document.createElement("h2");
  h.textContent = cat + " ";

  const small = document.createElement("small");
  small.textContent = "· " + sites.length;

  h.append(small);
  title.append(badge, h);
  head.append(title);
  sec.append(head);

  const grid = document.createElement("div");
  grid.className = "grid";
  sites.forEach(s => grid.append(createCard(s)));
  sec.append(grid);

  return sec;
}

function render(){
  const content = $("#content");
  content.innerHTML = "";
  const visible = getVisibleSites();

  if(!visible.length){
    const emp = document.createElement("div");
    emp.className = "empty glass";
    emp.textContent = "没有找到匹配的网站";
    content.append(emp);
  } else if(state.filter === "favorite"){
    content.append(sectionBlock("我的收藏", visible, iconFor("favorite")));
  } else if(state.filter === "recent"){
    content.append(sectionBlock("最近访问", visible, iconFor("recent")));
  } else if(state.filter !== "all"){
    const c = CATEGORIES.find(x=>x.name===state.filter);
    content.append(sectionBlock(state.filter, visible, c?.icon || "•"));
  } else {
    CATEGORIES.forEach(c=>{
      const group = visible.filter(s=>s.category===c.name);
      if(group.length) content.append(sectionBlock(c.name, group, c.icon));
    });
    const customCats = [...new Set(state.custom.map(x=>x.category))].filter(c=>!CATEGORIES.some(x=>x.name===c));
    customCats.forEach(cat=>{
      const group = visible.filter(s=>s.category===cat);
      if(group.length) content.append(sectionBlock(cat, group, "＋"));
    });
  }

  $("#allCount").textContent = allSites().length;
  $("#favCount").textContent = state.favorites.size;
  $("#recentCount").textContent = state.recents.length;
  $("#siteCount").textContent = allSites().length;
  $("#catCount").textContent = new Set(allSites().map(s=>s.category)).size;
}

function buildNav(){
  const box = $("#categoryNav");
  box.innerHTML = "";
  CATEGORIES.forEach(c=>{
    const b = document.createElement("button");
    b.className = "nav-btn";
    b.dataset.filter = c.name;

    const icon = document.createElement("span");
    icon.className = "nav-icon";
    icon.textContent = c.icon || "•";

    const label = document.createElement("span");
    label.className = "label";
    label.textContent = c.name;

    const count = document.createElement("span");
    count.className = "count";
    count.textContent = c.count;

    b.append(icon, label, count);
    box.append(b);
  });

  $$(".nav-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.filter = btn.dataset.filter;
      $$(".nav-btn").forEach(x=>x.classList.toggle("active", x===btn));
      render();
      $("#sidebar").classList.remove("show");
      window.scrollTo({top:0, behavior:"smooth"});
    });
  });
}

function buildCategorySelect(){
  const sel = $("#newCategory");
  sel.innerHTML = "";
  CATEGORIES.forEach(c=>{
    const o = document.createElement("option");
    o.value = c.name;
    o.textContent = c.name;
    sel.append(o);
  });
}

function openDrawer(){
  $("#drawer").classList.add("show");
  $("#backdrop").classList.add("show");
  renderCustomList();
}
function closeDrawer(){
  $("#drawer").classList.remove("show");
  $("#backdrop").classList.remove("show");
}

function renderCustomList(){
  const box = $("#customList");
  box.innerHTML = "";
  if(!state.custom.length){
    const p = document.createElement("p");
    p.style.color = "var(--muted)";
    p.style.fontSize = "12px";
    p.textContent = "还没有手动新增的网站。";
    box.append(p);
    return;
  }

  state.custom.forEach(site=>{
    const row = document.createElement("div");
    row.className = "custom-item";

    const g = document.createElement("div");
    g.className = "grow";

    const b = document.createElement("b");
    b.textContent = site.name;

    const s = document.createElement("small");
    s.textContent = site.category + " · " + site.domain;

    g.append(b, s);

    const edit = document.createElement("button");
    edit.className = "soft-btn";
    edit.style.height = "32px";
    edit.textContent = "编辑";
    edit.onclick = ()=>{
      const name = prompt("网站名称", site.name);
      if(name === null) return;
      const url = prompt("网址", site.url);
      if(url === null) return;
      try{
        const u = new URL(url);
        if(!/^https?:$/.test(u.protocol)) throw 0;
        site.name = name.trim() || site.name;
        site.url = u.href;
        site.domain = u.hostname.replace(/^www\./, "");
        save();
        render();
        renderCustomList();
        toast("已更新");
      }catch{
        alert("请输入有效的 http/https 网址");
      }
    };

    const del = document.createElement("button");
    del.className = "soft-btn danger";
    del.style.height = "32px";
    del.textContent = "删除";
    del.onclick = ()=>{
      if(confirm("删除「"+site.name+"」？")){
        state.custom = state.custom.filter(x=>x.id!==site.id);
        state.favorites.delete(site.id);
        save();
        render();
        renderCustomList();
      }
    };

    row.append(g, edit, del);
    box.append(row);
  });
}

function applyTheme(){
  const saved = localStorage.getItem(KEYS.theme);
  const theme = saved || ((window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light");
  document.documentElement.dataset.theme = theme;
}

applyTheme();
applyQuickIcons();
buildNav();
buildCategorySelect();
render();

$("#searchInput").addEventListener("input", e=>{
  state.query = e.target.value;
  render();
});

document.addEventListener("keydown", e=>{
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){
    e.preventDefault();
    $("#searchInput").focus();
    $("#searchInput").select();
  }
  if(e.key === "Escape"){
    closeDrawer();
    $("#sidebar").classList.remove("show");
  }
});

$("#themeBtn").onclick = ()=>{
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem(KEYS.theme, next);
};
$("#mobileMenuBtn").onclick = ()=>$("#sidebar").classList.toggle("show");
$("#manageBtn").onclick = openDrawer;
$("#closeDrawer").onclick = closeDrawer;
$("#backdrop").onclick = closeDrawer;

$("#addForm").addEventListener("submit", e=>{
  e.preventDefault();
  const name = $("#newName").value.trim();
  const url = $("#newUrl").value.trim();
  const category = $("#newCategory").value;

  try{
    const u = new URL(url);
    if(!/^https?:$/.test(u.protocol)) throw 0;

    state.custom.push({
      id: "c" + Date.now(),
      name,
      url: u.href,
      category,
      domain: u.hostname.replace(/^www\./, ""),
      fullTitle: name,
      icon: ""
    });

    save();
    e.target.reset();
    render();
    renderCustomList();
    toast("已添加到导航");
  }catch{
    alert("请输入有效的 http:// 或 https:// 网址");
  }
});

$("#exportBtn").onclick = ()=>{
  const payload = {version:4, favorites:[...state.favorites], recents:state.recents, custom:state.custom};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "feitianxiaoxiang-nav-backup.json";
  a.click();
  URL.revokeObjectURL(a.href);
};

$("#importBtn").onclick = ()=>$("#importFile").click();
$("#importFile").addEventListener("change", async e=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const d = JSON.parse(await file.text());
    state.custom = Array.isArray(d.custom) ? d.custom : [];
    state.recents = Array.isArray(d.recents) ? d.recents : [];
    state.favorites = new Set(Array.isArray(d.favorites) ? d.favorites : []);
    save();
    render();
    renderCustomList();
    toast("配置已导入");
  }catch{
    alert("配置文件无效");
  }
  e.target.value = "";
});
</script>
</body>
</html>
