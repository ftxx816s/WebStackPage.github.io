<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>私人导航工具箱 · V18.70</title>
<meta name="theme-color" content="#1c1c1e">
<script>
(function(){
  var allowed={dark:1,light:1,liquid:1,neon:1,frosted:1};
  var keys=["fxnav_theme","feitianxiaoxiang_theme_v5","dumbo_theme_v4","dumbo_theme_v3","dumbo_theme_v2","dumbo_theme"];
  var theme="";
  try{
    for(var i=0;i<keys.length;i++){
      var v=localStorage.getItem(keys[i]);
      if(v&&allowed[v]){theme=v;break;}
    }
  }catch(e){}
  if(!allowed[theme]){
    try{theme=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){theme="dark"}
  }
  document.documentElement.setAttribute("data-theme",theme);
  document.documentElement.style.colorScheme=(theme==="light"||theme==="liquid")?"light":"dark";
  var colors={dark:"#07101d",light:"#edf3ff",liquid:"#eef4ff",neon:"#020713",frosted:"#050506"};
  document.documentElement.style.backgroundColor=colors[theme]||colors.dark;
  window.__FXNAV_REDIRECT_THEME__=theme;
})();
</script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:grid;place-items:start center;padding-top:6px;color:#aab6ca;background:#07101d;overflow:hidden}
.redirect-note{font-size:13px;font-weight:700;letter-spacing:.01em;opacity:.9}
html[data-theme="light"] body{background:#edf3ff;color:#64738b}
html[data-theme="liquid"] body{background:linear-gradient(135deg,#eef4ff,#f8fbff);color:#64738b}
html[data-theme="neon"] body{background:#020713;color:#9cb6dc}
html[data-theme="frosted"] body{background:radial-gradient(56rem 28rem at 60% -14%,rgba(255,255,255,.018),transparent 66%),linear-gradient(180deg,#040405 0%,#060607 46%,#09090a 100%);color:#c7c7c4}
</style>
</head>
<body>
<div class="redirect-note">正在进入私人导航...</div>
<script>location.replace('./cn/');</script>
</body>
</html>
